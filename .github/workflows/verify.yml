name: Verify

# Lint, unit tests, and the production build. Nothing deploys and no secrets are used
# (Vercel's GitHub integration handles deployment).
#
# This repository is public. pull_request runs the workflow from the merge commit, so a
# pull request can replace this file and execute the replacement. Do not send pull_request,
# or any other event an outsider can trigger, to a self-hosted runner. GitHub-hosted
# runners are ephemeral VMs and are destroyed at the end of the job.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The pnpm Corepack shim prompts before downloading unless this is 0. There is no TTY on the runner.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        # The previous job ran in node:22-bookworm, which supplied Node and Corepack.
        # ubuntu-latest has git and compilers, but not the pinned Node 22.23.4 runtime.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Run the checks
        run: bash .github/scripts/verify.sh
